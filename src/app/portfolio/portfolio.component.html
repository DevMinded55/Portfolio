<section id="project-section">
    <div class="portfolio content">
        <h3 appRevealOnScroll>{{'projects.h3' | translate }}</h3>
        @for (item of projects; track $index) {
            <app-portfolio-item appRevealOnScroll [revealDelay]="$index * 120" [projects]="item" [index]="$index"></app-portfolio-item>
        }
    </div>
</section>
